  <circle cx="176" cy="320" r="10" fill="#0f0f0f" opacity="0.3"/>
  <circle cx="176" cy="320" r="7" fill="#3b82f6"/>
  <circle cx="336" cy="320" r="10" fill="#0f0f0f" opacity="0.3"/>
  <circle cx="336" cy="320" r="7" fill="#3b82f6"/>
  <!-- Crown peaks (balls) -->
