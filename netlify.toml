# Netlify — staging / backup deploy alongside Vercel (production: kingof.lol on Vercel).
# Connect the same Git repo at https://app.netlify.com — env vars must be set in Netlify UI.

[build]
  command = "npm run build"
  # Override Netlify UI if publish is set to repo root (breaks @netlify/plugin-nextjs).
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/"
  to = "/en"
  status = 302

[[redirects]]
  from = "https://kingof.lol/*"
  to = "https://www.kingof.lol/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
