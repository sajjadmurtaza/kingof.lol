name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kingof_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: re_ci
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SITE_URL: https://kingof.lol
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit & integration tests (100% coverage)
        run: npm run test:coverage

      - name: i18n validation
        run: npm run validate:i18n

      - name: Production build
        run: npm run build

      - name: Post-build SEO checks
        run: npm run test:seo

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
